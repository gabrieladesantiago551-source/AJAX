spring.application.name=ajax

# ── Base de datos ──────────────────────────────────────────────────────────────
# En Render: configura estas variables en Environment → Add Environment Variable
# En local: sigue usando los valores por defecto que ya tenías
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/sams}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ── Puerto ─────────────────────────────────────────────────────────────────────
# Render inyecta $PORT automáticamente; si no existe, usa 8080
server.port=${PORT:8080}
